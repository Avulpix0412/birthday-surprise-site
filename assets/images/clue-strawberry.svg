<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Grass tuft the strawberry is nestled in -->
  <g fill="#7fa66a">
    <ellipse cx="30" cy="105" rx="14" ry="7" transform="rotate(-15 30 105)"/>
    <ellipse cx="60" cy="110" rx="16" ry="8" transform="rotate(5 60 110)"/>
    <ellipse cx="90" cy="103" rx="14" ry="7" transform="rotate(18 90 103)"/>
  </g>
  <g fill="#8ba179">
    <ellipse cx="45" cy="100" rx="12" ry="6" transform="rotate(-8 45 100)"/>
    <ellipse cx="75" cy="102" rx="12" ry="6" transform="rotate(10 75 102)"/>
  </g>

  <!-- Strawberry body -->
  <path d="M 60 40
           C 78 40 90 55 90 72
           C 90 92 76 108 60 108
           C 44 108 30 92 30 72
           C 30 55 42 40 60 40 Z"
        fill="#d9484f"/>
  <path d="M 60 40
           C 78 40 90 55 90 72
           C 90 82 84 92 76 99
           C 80 84 76 62 60 55
           C 44 62 40 84 44 99
           C 36 92 30 82 30 72
           C 30 55 42 40 60 40 Z"
        fill="#e2565d" opacity="0.55"/>

  <!-- Seeds -->
  <g fill="#f4d35e">
    <ellipse cx="46" cy="60" rx="2.2" ry="3.4" transform="rotate(-20 46 60)"/>
    <ellipse cx="62" cy="55" rx="2.2" ry="3.4" transform="rotate(5 62 55)"/>
    <ellipse cx="76" cy="62" rx="2.2" ry="3.4" transform="rotate(25 76 62)"/>
    <ellipse cx="40" cy="76" rx="2.2" ry="3.4" transform="rotate(-15 40 76)"/>
    <ellipse cx="58" cy="74" rx="2.2" ry="3.4"/>
    <ellipse cx="74" cy="78" rx="2.2" ry="3.4" transform="rotate(15 74 78)"/>
    <ellipse cx="50" cy="90" rx="2.2" ry="3.4" transform="rotate(-10 50 90)"/>
    <ellipse cx="68" cy="92" rx="2.2" ry="3.4" transform="rotate(10 68 92)"/>
  </g>

  <!-- Calyx / leafy top -->
  <g fill="#6b9b52">
    <path d="M 60 44 L 46 24 L 56 38 Z"/>
    <path d="M 60 44 L 74 24 L 64 38 Z"/>
    <path d="M 60 44 L 60 20 L 68 36 Z"/>
    <path d="M 60 44 L 60 20 L 52 36 Z"/>
    <path d="M 60 44 L 40 34 L 52 42 Z"/>
    <path d="M 60 44 L 80 34 L 68 42 Z"/>
  </g>
</svg>
