<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>给你的生日惊喜</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg-garden" aria-hidden="true"></div>

  <div id="clue-tray" hidden></div>
  <div id="nudge-toast" aria-live="polite"></div>

  <section id="cover" class="section">
    <h1 class="cover-title">给你的生日惊喜</h1>
    <p class="cover-intro">我们已经认识一年多啦，这是我正式陪你过的第一个生日。虽然不在你身边，但是这一年我们一起经历了很多事情，一起来回顾一下吧。</p>
    <button id="start-btn" class="start-btn">点击开始</button>
  </section>

  <div id="card-stack" hidden></div>

  <button id="audio-toggle" hidden aria-label="音乐开关">🎵</button>

  <audio id="bg-audio" preload="none" loop></audio>

  <script src="js/vendor/confetti.browser.min.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
